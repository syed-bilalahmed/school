; ==============================================================================
; PHP PRODUCTION & HIGH CONCURRENCY TUNING (3000+ USERS)
; Paste or append these directives into your php.ini
; Path in XAMPP: C:\xampp\php\php.ini
; After modifying, restart Apache in XAMPP Control Panel.
; ==============================================================================

[PHP]
; Memory limit per request (256MB is safe and generous for multi-tenant ERP)
memory_limit = 256M

; Execution time limit (keep small so stuck queries don't exhaust workers)
max_execution_time = 30
max_input_time = 60

; Upload limits for report exports / student documents
upload_max_filesize = 25M
post_max_size = 30M
max_input_vars = 5000

; Error logging in production (never output errors directly to the browser)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ------------------------------------------------------------------------------
; OPcache Configuration (CRITICAL FOR 3000+ USERS)
; Precompiles PHP scripts into shared RAM — yields 3x-5x speed improvement
; ------------------------------------------------------------------------------
[opcache]
zend_extension=opcache
opcache.enable=1
opcache.enable_cli=1

; RAM allocated for compiled PHP scripts (MB)
opcache.memory_consumption=256

; Size of string buffer in MB
opcache.interned_strings_buffer=16

; Maximum cached PHP script files (ERP has ~100-200 files, 10000 is plenty)
opcache.max_accelerated_files=10000

; Revalidate frequency in seconds (60s gives high performance while catching file updates)
opcache.revalidate_freq=60

; In strict production: set to 0 for zero disk checks (manual restart on code updates)
; For development/staging: set to 1
opcache.validate_timestamps=1

opcache.save_comments=1
opcache.fast_shutdown=1

; ------------------------------------------------------------------------------
; Realpath Cache (Speeds up include/require file resolution)
; ------------------------------------------------------------------------------
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; ------------------------------------------------------------------------------
; Session Tuning (Prevents session file lock contention across 3000+ users)
; ------------------------------------------------------------------------------
[Session]
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 86400
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
