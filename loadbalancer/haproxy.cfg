# ==============================================================================
# HAPROXY HIGH-PERFORMANCE LOAD BALANCER CONFIGURATION
# Capable of 100,000+ Concurrent HTTP & Database Connections
# ==============================================================================

global
    log /dev/log local0 info
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon

    # Maximum global concurrent connections
    maxconn 100000

    # Multi-threaded execution
    nbthread 4

    # SSL configuration
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option forwardfor
    option http-server-close

    # High-concurrency timeout tuning
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout http-request 10s
    timeout http-keep-alive 60s
    timeout queue   30s

# ==============================================================================
# LIVE MONITORING & TELEMETRY DASHBOARD (Port 8404)
# ==============================================================================
listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
    stats show-node
    stats auth admin:SecureAdminPass2026!

# ==============================================================================
# HTTP FRONTEND (Port 80) — Redirects to HTTPS
# ==============================================================================
frontend http_in
    bind *:80
    redirect scheme https code 301 if !{ ssl_fc }

# ==============================================================================
# HTTPS FRONTEND (Port 443) — SSL Termination & Routing
# ==============================================================================
frontend https_in
    bind *:443 ssl crt /etc/ssl/certs/school.pem alpn h2,http/1.1
    mode http

    # Pass client details to web nodes
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port %[dst_port]
    http-request add-header X-Real-IP %[src]

    # Route to web application cluster
    default_backend school_web_nodes

# ==============================================================================
# WEB APPLICATION BACKEND POOL
# ==============================================================================
backend school_web_nodes
    mode http
    balance leastconn

    # Health Check via /health endpoint (checks PHP + DB readiness)
    option httpchk GET /health HTTP/1.1\r\nHost:\ localhost
    http-check expect status 200

    # Compression for text, JSON, and HTML
    compression algo gzip
    compression type text/html text/plain text/css application/json application/javascript

    # Web Nodes with dynamic health check (inter 3s, fall 2, rise 2)
    server web01 192.168.1.101:80 check inter 3s fall 2 rise 2 maxconn 30000
    server web02 192.168.1.102:80 check inter 3s fall 2 rise 2 maxconn 30000
    server web03 192.168.1.103:80 check inter 3s fall 2 rise 2 maxconn 30000

# ==============================================================================
# LAYER 4 TCP: MYSQL READ-REPLICA CLUSTER BALANCER (Port 3307)
# ==============================================================================
# Allows web servers to connect to 127.0.0.1:3307, and HAProxy automatically
# load-balances read queries across all MySQL read-replicas!
listen mysql_read_cluster
    bind *:3307
    mode tcp
    option mysql-check user haproxy_check
    balance roundrobin
    maxconn 20000

    server mysql_rep1 192.168.1.201:3306 check inter 2s fall 2 rise 2
    server mysql_rep2 192.168.1.202:3306 check inter 2s fall 2 rise 2
    server mysql_rep3 192.168.1.203:3306 check inter 2s fall 2 rise 2
