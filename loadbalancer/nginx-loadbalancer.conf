# ==============================================================================
# HIGH-CONCURRENCY NGINX LOAD BALANCER CONFIGURATION
# Optimized for 100,000+ Concurrent Users & High-Volume Record Fetching
# ==============================================================================

# Run as dedicated nginx worker user
user nginx;

# Automatically scale worker processes to CPU core count
worker_processes auto;

# Maximum number of open files (sockets) per worker process
# Set high to accommodate 100,000 concurrent client connections
worker_rlimit_nofile 200000;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # Connections per worker process
    worker_connections 25000;
    
    # Accept multiple connections per cycle for instant throughput
    multi_accept on;
    
    # Use high-performance epoll event notification mechanism (Linux)
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # High-Performance File Sending
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Timeouts tuned for high-concurrency connection recycling
    keepalive_timeout 65;
    keepalive_requests 100000;
    reset_timedout_connection on;
    client_body_timeout 15;
    send_timeout 15;

    # Client Request Buffers (Prevents Slowloris DDoS attacks)
    client_body_buffer_size 128k;
    client_max_body_size 64M;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Gzip Compression (Saves 75% network bandwidth when fetching heavy records)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ==========================================================================
    # UPSTREAM WEB APPLICATION CLUSTER (LOAD BALANCING POOL)
    # ==========================================================================
    # Algorithms:
    # - least_conn: Directs new requests to the backend server with fewest active connections.
    #   Best algorithm for mixed workloads (fast static views + heavy record fetches).
    upstream school_web_cluster {
        least_conn;

        # Web Node 01
        server 192.168.1.101:80 max_fails=3 fail_timeout=10s weight=1;

        # Web Node 02
        server 192.168.1.102:80 max_fails=3 fail_timeout=10s weight=1;

        # Web Node 03
        server 192.168.1.103:80 max_fails=3 fail_timeout=10s weight=1;

        # Optional Web Node 04
        # server 192.168.1.104:80 max_fails=3 fail_timeout=10s weight=1;

        # Keepalive connections to upstream servers to avoid continuous TCP handshakes
        keepalive 128;
    }

    # Microcache zone for public/static record lookups (60 seconds cache)
    proxy_cache_path /var/cache/nginx/school_cache levels=1:2 keys_zone=SCHOOL_CACHE:100m max_size=2g inactive=60m use_temp_path=off;

    # Rate Limiting Zone for DDoS Mitigation (30 requests/second with burst 60)
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=40r/s;

    server {
        listen 80;
        listen [::]:80;
        server_name school.yourdomain.com www.school.yourdomain.com;

        # Redirect all HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name school.yourdomain.com www.school.yourdomain.com;

        # SSL Configuration (Update paths to your certificates)
        ssl_certificate /etc/ssl/certs/school_ssl.crt;
        ssl_certificate_key /etc/ssl/certs/school_ssl.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ======================================================================
        # 1. LOAD BALANCER HEALTH CHECK ENDPOINT (Zero Caching, Fast Probe)
        # ======================================================================
        location = /health {
            proxy_pass http://school_web_cluster/health.php;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 3s;
            access_log off;
        }

        # ======================================================================
        # 2. STATIC ASSET DIRECT CACHING & OFFLOAD (Bypasses PHP Backend)
        # ======================================================================
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
            proxy_pass http://school_web_cluster;
            proxy_set_header Host $host;
            proxy_cache SCHOOL_CACHE;
            proxy_cache_valid 200 304 30d;
            proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status;
            expires 30d;
            access_log off;
        }

        # ======================================================================
        # 3. CORE WEB APPLICATION & API PROXY (Load Balanced)
        # ======================================================================
        location / {
            # Apply rate limiting against aggressive bots
            limit_req zone=api_limit burst=80 nodelay;

            proxy_pass http://school_web_cluster;
            proxy_http_version 1.1;

            # Keep connection alive
            proxy_set_header Connection "";

            # Pass real client headers to PHP
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # High-Concurrency Proxy Buffer Optimization
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 16 128k;
            proxy_busy_buffers_size 256k;
            proxy_temp_file_write_size 256k;

            # Upstream Failover & Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }
    }
}
